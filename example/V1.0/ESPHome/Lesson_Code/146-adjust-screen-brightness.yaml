# ================= font =================
font:                                           # Font configuration for display
  - file: "gfonts://Roboto"                     # Load Roboto font from Google Fonts
    id: roboto24                                # Unique ID for 24px Roboto font
    size: 24                                    # Font size in pixels

# LVGL (Light and Versatile Graphics Library) configuration
lvgl:
  displays:
    - round_display                                  # Link LVGL to our display component
  buffer_size: 50%                                   # Use 50% of available RAM for LVGL buffer

  # LVGL UI layout - brightness title and percentage
  widgets:
    # Title label widget
    - label:
        align: CENTER                                # Align text to center of display
        id: lbl_title                                # Unique ID for title label
        y: -30                                       # Y position offset (30px up from center)
        text_font: montserrat_22                     # Font type and size (Montserrat 22pt)
        text: "Screen Brightness"                    # Default text for title

    # Brightness percentage label widget
    - label:
        align: CENTER                                # Align text to center of display
        id: lbl_brightness                           # Unique ID for brightness label
        y: 20                                        # Y position offset (20px down from center)
        text_font: montserrat_48                     # Font type and size (Montserrat 48pt)
        text: "50%"                                  # Default brightness text
