esphome:
  name: rotary-screen-146-display
  friendly_name: Rotary_Screen_1.46_Display
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 900
    then:
      - logger.log: "POWER ON"
      - output.turn_on: VCC_5
      - switch.turn_on: Vcc_3_Switch
      - output.turn_on: Red_LED
      - delay: 150ms
      - light.turn_on:
          id: display_backlight
          brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:

debug:
  update_interval: 30s

# Enable Home Assistant API
api:
  encryption:
    key: "XSCr5HHOMRzn55Ch8+HfGYhnEevFL9OAxm8YJbkTr/U="

ota:
  - platform: esphome
    password: "b0a0f8876c261e9413c3036c357d0675"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rotary-Screen-146-Display"
    password: "U51T8AKI6joe"

captive_portal:
  
output:
  - platform: ledc
    id: backlight
    pin: GPIO46    
  - platform: gpio
    id: VCC_5
    pin: GPIO2      
  - platform: gpio
    id: Red_LED
    pin: GPIO40        

switch:
  - platform: gpio
    name: "VCC_3 Control"
    id: Vcc_3_Switch
    pin:
      number: GPIO1
      mode:
        output: true
    restore_mode: ALWAYS_ON
    on_turn_on:
      - logger.log: "GPIO1 is HIGH"

light:
  - platform: monochromatic
    output: backlight
    id: display_backlight
    restore_mode: ALWAYS_ON  

spi:
  id: spi_bus
  mosi_pin: 11
  clk_pin: 10

display:
  - platform: ili9xxx                               # ILI9XXX display driver
    id: round_display                               # Display ID
    model: CUSTOM                                   # Custom display model
    cs_pin: GPIO9                                   # SPI chip select pin
    dc_pin: GPIO3                                   # Data/command pin
    reset_pin: GPIO14                               # Display reset pin
    dimensions:
      width: 360                                    # Screen width (px)
      height: 360                                   # Screen height (px)
      offset_height: 0                              # Vertical offset
    data_rate: 40MHz                                # SPI communication speed
    color_order: RGB                                # RGB color order
    invert_colors: false                            # No color inversion
    init_sequence:                                  # Display initialization commands
      - [0xDE, 0x00]
