lvgl:  # LVGL graphics library configuration
  displays:
    - round_display                                # Bind to round display
  buffer_size: 50%                                 # Use 50% PSRAM for buffer

  widgets:  # UI widget definitions (bottom to top)
    - image:  # Background image widget
        align: CENTER                              # Align to screen center
        id: img_bg                                 # Widget ID
        src: img_bg_light                          # Bind to image resource
        width: 360                                 # Full screen width
        height: 360                                # Full screen height
        antialias: true                            # Enable anti-aliasing

    - label:  # Brightness title label
        align: CENTER                              # Align to center
        id: lbl_title                              # Widget ID
        y: -70                                     # Offset upward
        text_font: montserrat_24                   # Use 24px font
        text: "Brightness"                         # Display text
        text_color: 0xFFFFFF                       # White text color
        text_opa: "100%"                           # Full opacity

    - arc:  # Brightness arc indicator
        align: CENTER                              # Align to center
        id: arc_brightness                         # Widget ID
        value: 50                                  # Default value
        min_value: 0                                # Minimum value
        max_value: 100                              # Maximum value
        start_angle: 135                            # Arc start angle
        end_angle: 45                              # Arc end angle
        width: 260                                 # Widget width
        height: 260                                # Widget height
        
        arc_color: 0x1A1A1A                        # Background arc color
        arc_width: 18                              # Background arc thickness
        arc_rounded: true                          # Rounded ends
        
        indicator:                                  # Progress indicator
          arc_color: 0x00D2FF                      # Indicator color
          arc_width: 18                            # Indicator thickness
          arc_rounded: true                        # Rounded ends
          
        knob:                                       # Arc knob
          bg_color: 0xFFFFFF                        # Knob color
          bg_opa: "100%"                            # Full opacity
          width: 32                                 # Knob width
          height: 32                                # Knob height
          radius: 10                               # Circular knob

    - label:  # Brightness percentage label
        align: CENTER                              # Align to center
        id: lbl_brightness                         # Widget ID
        text_font: montserrat_56                   # Use 56px large font
        text: "50%"                                # Default text
        text_color: 0xFFFFFF                       # White text color
        text_opa: "100%"                           # Full opacity