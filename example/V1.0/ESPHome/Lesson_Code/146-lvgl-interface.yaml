# Global variable definitions (persistent across runtime)
globals:
  - id: brightness_value                           # Global brightness storage
    type: int                                       # Data type: integer
    restore_value: false                            # Do not save to flash
    initial_value: "50"                             # Default value: 50%

  - id: encoder_ready                              # Encoder enable flag
    type: bool                                      # Data type: boolean
    restore_value: false                            # No flash restore
    initial_value: "false"                          # Start disabled

output:
  - platform: ledc                                  # LEDC PWM output driver
    id: backlight                                   # Backlight PWM ID
    pin: GPIO46                                     # Backlight control pin
    frequency: 5000Hz                               # PWM frequency
  - platform: gpio                                  # GPIO output driver
    id: VCC_5                                       # 5V power control
    pin: GPIO2                                      # 5V enable pin
  - platform: gpio                                  # GPIO output driver
    id: Red_LED                                     # Red LED indicator
    pin: GPIO40                                     # LED control pin

switch:
  - platform: gpio                                  # GPIO switch component
    name: "VCC_3 Control"                           # Friendly name
    id: Vcc_3_Switch                                # Switch ID
    pin:
      number: GPIO1                                 # 3.3V enable pin
      mode:
        output: true                                # Set as output mode
    restore_mode: ALWAYS_ON                         # Always ON after boot
    on_turn_on:
      - logger.log: "GPIO1 is HIGH"                 # Log when enabled

light:
  - platform: monochromatic                         # Monochromatic light driver
    output: backlight                               # Bind to PWM output
    id: display_backlight                           # Light ID
    restore_mode: ALWAYS_ON                         # Always ON after boot

sensor:
  - platform: rotary_encoder                        # Rotary encoder sensor
    id: knob                                        # Encoder ID
    name: "Encoder"                                 # Friendly name
    pin_a:
      number: 45                                    # Encoder phase A pin
      mode:
        input: true                                 # Set as input
        pullup: true                                # Enable internal pull-up
    pin_b:
      number: 42                                    # Encoder phase B pin
      mode:
        input: true                                 # Set as input
        pullup: true                                # Enable internal pull-up
    resolution: 1                                   # Encoder resolution

    filters:  # Anti-noise signal filters
      - debounce: 20ms                              # Filter hardware jitter
      - lambda: return round(x);                    # Convert to integer value

    on_value:  # Trigger on encoder rotation
      then:
        - lambda: |-
            if (!id(encoder_ready)) return;         // Skip if not initialized
            static bool first_run = true;           // First run flag
            static int last_encoder = 0;            // Last encoder state
            int current = (int) id(knob).state;     // Current encoder value

            if (first_run) {                        // Initialize baseline
              last_encoder = current;
              first_run = false;
              return;
            }

            int delta = current - last_encoder;     // Calculate rotation change
            last_encoder = current;                 // Update last value
            if (delta == 0) return;                 // Ignore no movement

            if (delta < 0) {                        // CCW: decrease brightness
              id(brightness_value) -= 5;
            } else {                                // CW: increase brightness
              id(brightness_value) += 5;
            }

            if (id(brightness_value) < 0) id(brightness_value) = 0;       // Min limit
            if (id(brightness_value) > 100) id(brightness_value) = 100;   // Max limit

            float level = id(brightness_value) / 100.0f;                  // Convert to 0.0-1.0
            id(backlight).set_level(level);                               // Set PWM output

            lv_arc_set_value(id(arc_brightness), id(brightness_value));   // Update arc
            char buf[10];                                                 // String buffer
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_value));     // Format text
            lv_label_set_text(id(lbl_brightness), buf);                   // Update label
            lv_refr_now(NULL);                                            // Refresh display

i2c:
  - id: i2c_touch                                  # I2C bus for touchscreen
    sda: 6                                          # I2C data pin
    scl: 7                                          # I2C clock pin
    scan: true                                      # Auto-scan I2C devices
    frequency: 400kHz                               # I2C bus speed

touchscreen:
  platform: cst816                                  # CST816 touch driver
  id: my_touchscreen                                # Touchscreen ID
  interrupt_pin: 5                                  # Touch interrupt pin
  reset_pin: 13                                     # Touch reset pin
  i2c_id: i2c_touch                                 # Bind to I2C bus
  address: 0x15                                     # I2C address
  transform:
    mirror_x: false                                 # No X mirroring
    mirror_y: true                                  # Enable Y mirroring
    swap_xy: true                                   # Swap X and Y axes
  on_touch:
    - logger.log:
        format: "Touch at (%d, %d)"                 # Log touch coordinates
        args: [touch.x, touch.y]
    - lambda: |-
        ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",  // Debug touch data
        touch.x,
        touch.y,
        touch.x_raw,
        touch.y_raw
        );

