esphome:
  name: 146-lvgl-interface
  friendly_name: 1.46_LVGL_Interface
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"               # Enable PSRAM support
    board_build.esp-idf.memory_type: qio_opi       # Set PSRAM memory type
    board_build.flash_mode: dio                    # Set flash operating mode
  on_boot:
    priority: 900                                  # Boot execution priority
    then:
      - logger.log: "POWER ON"                     # Log boot start message
      - output.turn_on: VCC_5                      # Power on 5V rail
      - switch.turn_on: Vcc_3_Switch               # Power on 3.3V rail
      - output.turn_on: Red_LED                    # Turn on status LED
      - delay: 150ms                               # Short stabilization delay
      - light.turn_on:
          id: display_backlight                    # Target backlight component
          brightness: 100%                          # Temporary full brightness
      # Brightness initialization logic
      - delay: 500ms                               # Delay for display hardware init
      
      # Initialize brightness and encoder (frozen state)
      - lambda: |-
          id(encoder_ready) = false;                // Disable encoder during boot
          id(brightness_value) = 50;                // Set default brightness to 50%
          
          // Force reset rotary encoder internal state
          id(knob).publish_state(0);               // Reset encoder counter to 0
      
      # Initial brightness (50%)
      - light.turn_on:
          id: display_backlight                    # Backlight light component
          brightness: 0.5                          # Set 50% brightness (0.0-1.0)
          
      # Initialize LVGL text on startup (display 50%)
      - lambda: |-
          lv_arc_set_value(id(arc_brightness), id(brightness_value));
          char buf[10];                                               // Buffer for percentage string
          snprintf(buf, sizeof(buf), "%d%%", id(brightness_value));   // Format value
          lv_label_set_text(id(lbl_brightness), buf);                 // Update label text
          lv_refr_now(NULL);                                          // Force immediate display refresh
      
      # Wait for state reset to complete
      - delay: 200ms                               # Ensure encoder reset finishes
      
      # Enable encoder after initialization
      - lambda: |-
          id(encoder_ready) = true;                // Enable encoder operation

esp32:
  board: esp32-s3-devkitc-1                        # Target ESP32-S3 board model
  flash_size: 16MB                                 # Flash memory size
  framework:
    type: esp-idf                                  # Use ESP-IDF framework
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y       # Set CPU clock to 240MHz
      CONFIG_ESP32S3_DATA_CACHE_64KB: y            # Enable 64KB data cache
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y          # Allow instructions from PSRAM
      CONFIG_SPIRAM_RODATA: y                      # Allow read-only data from PSRAM

psram:
  mode: octal                                      # PSRAM operating mode
  speed: 80MHz                                     # PSRAM clock speed

